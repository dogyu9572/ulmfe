# 운영(hkstsdemo) — mvn package -Pprod 빌드 시 활성화
# 비밀번호는 JAR에 넣지 말고 SPRING_DATASOURCE_PASSWORD 환경 변수로 주입

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: ${APP_SESSION_COOKIE_SAME_SITE:lax}
        secure: ${APP_SESSION_COOKIE_SECURE:true}

file:
  upload:
    path: /home/hkstsdemo/uploads

app:
  security:
    csrf-cookie-same-site: ${APP_CSRF_COOKIE_SAME_SITE:Lax}
    csrf-cookie-secure: ${APP_CSRF_COOKIE_SECURE:true}
  cors:
    allowed-origins:
      - https://hkstsdemo.hk-test.co.kr
      - http://hkstsdemo.hk-test.co.kr

spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/hkstsdemo?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:hkstsdemou}
    password: ${SPRING_DATASOURCE_PASSWORD:}

logging:
  level:
    root: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
    egovframework: INFO

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

