server:
  port: 9013
  address: 0.0.0.0
  servlet:
    session:
      timeout: 30m
      # 마리나·다른 앱과 기본 JSESSIONID가 충돌하지 않도록 데모관리자 전용 쿠키명 사용
      cookie:
        name: ${APP_SESSION_COOKIE_NAME:HKEGO_ADM_SESSIONID}
        http-only: true
        same-site: ${APP_SESSION_COOKIE_SAME_SITE:lax}
        secure: ${APP_SESSION_COOKIE_SECURE:false}

file:
  upload:
    path: /home/hksts-webapp/uploads

app:
  crypto:
    secret-key: ${APP_CRYPTO_SECRET_KEY:CHANGE_ME_32_BYTE_SECRET_KEY_123}
  auth:
    admin-manage-roles: ${APP_AUTH_ADMIN_MANAGE_ROLES:SUPER,MANAGER}
    super-role-code: ${APP_AUTH_SUPER_ROLE_CODE:SUPER}
  security:
    login-max-attempts: ${APP_SECURITY_LOGIN_MAX_ATTEMPTS:5}
    login-lock-minutes: ${APP_SECURITY_LOGIN_LOCK_MINUTES:15}
    csrf-cookie-same-site: ${APP_CSRF_COOKIE_SAME_SITE:Lax}
    csrf-cookie-secure: ${APP_CSRF_COOKIE_SECURE:false}
  cors:
    allowed-origins:
      - http://localhost:3013
      - http://127.0.0.1:3013
      - http://192.168.0.5:3013
      - http://106.240.255.10:3013
      - http://106.240.255.10:9013
      - http://localhost:3014
      - http://127.0.0.1:3014
      - http://192.168.0.5:3014
      - http://hkstsdemo.hk-test.co.kr
      - https://hkstsdemo.hk-test.co.kr

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: 127.0.0.1
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: ${SPRING_DATASOURCE_URL:jdbc:p6spy:mariadb://127.0.0.1:3306/ulmfe}
    username: ${SPRING_DATASOURCE_USERNAME:ulmfe}
    password: ${SPRING_DATASOURCE_PASSWORD:}


Globals:
  LocalIp: 127.0.0.1
  DbType: mysql
  pageUnit: 10
  pageSize: 10
  posblAtchFileSize: 5242880
  fileStorePath: ${file.upload.path}
  addedOptions: false
  fileUpload:
    Extensions:
      Images: .gif.jpg.jpeg.png
      All: .gif.jpg.jpeg.png.xls.xlsx

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    egovframework: DEBUG

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: egovframework.let.adm.service.vo
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
