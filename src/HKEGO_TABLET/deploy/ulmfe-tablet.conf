<VirtualHost *:80>
    ServerName ulmfe-tablet.hk-test.co.kr
    ServerAdmin webmaster@hk-test.co.kr

    ErrorLog ${APACHE_LOG_DIR}/ulmfe-tablet-error.log
    CustomLog ${APACHE_LOG_DIR}/ulmfe-tablet-access.log combined

    LimitRequestBody 12582912

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:9133/
    ProxyPassReverse / http://127.0.0.1:9133/
</VirtualHost>
