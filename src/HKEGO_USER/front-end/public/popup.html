<div class="pop_gen">
    <div class="pop_slide_wrap swiper">
        <div class="pop_slide swiper-wrapper">
            <div class="slide swiper-slide"><img src="/pub/images/img_popup_sample.webp" alt="샘플 이미지"></div>
            <div class="slide swiper-slide"><img src="/pub/images/img_popup_sample.webp" alt="샘플 이미지"></div>

</div>
<style>
.pop_gen {position:fixed; top:50%; left:50%; width:500px; max-width:calc(100vw - 30px); transform:translate(-50%,-50%); border-radius:20px; overflow:hidden; z-index:111; box-shadow:rgba(0,0,0,.4) 0 0 20px; animation:pop_gen 1s forwards;}
