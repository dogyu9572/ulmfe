<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <div id="include-dtd" style="display: none;"></div>
	<!-- 스타일을 바로 읽지 못해 불러들이기 위한 스크립트. -->
	<script>
        function initIncludes() {
            const dtdContainer = document.getElementById('include-dtd');
            if (dtdContainer) {
                fetch('/pub/inc/dtd.html').then(res => res.ok ? res.text() : '').then(data => {
                    dtdContainer.outerHTML = data;
                    const cssFiles = ['/pub/css/styles.css', '/pub/css/styles_sub.css', '/pub/css/styles_terms.css'];
                    cssFiles.forEach(url => {
                        fetch(url, { method: 'HEAD' }).then(cssRes => {
                            let ver = cssRes.ok && cssRes.headers.get('Last-Modified') ? new Date(cssRes.headers.get('Last-Modified')).getTime() : Date.now();
                            const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = `${url}?v=${ver}`; link.media = 'all'; document.head.appendChild(link);
                        }).catch(() => {
                            const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = `${url}?v=${Date.now()}`; link.media = 'all'; document.head.appendChild(link);
                        });
                    });
                    
                    const jsFiles = ['/pub/js/com.js'];
                    jsFiles.forEach(url => {
                        fetch(url, { method: 'HEAD' }).then(jsRes => {
                            let jsVer = jsRes.ok && jsRes.headers.get('Last-Modified') ? new Date(jsRes.headers.get('Last-Modified')).getTime() : Date.now();
                            const script = document.createElement('script'); script.src = `${url}?v=${jsVer}`;
                            document.head.appendChild(script);
                        }).catch(() => {
                            const script = document.createElement('script'); script.src = `${url}?v=${Date.now()}`;
                            document.head.appendChild(script);
                        });
                    });
                }).catch(err => console.error(err));
            }
            
            const elements = document.querySelectorAll('[data-include]');
            let pCount = 0;
            if (elements.length === 0) return;

            elements.forEach(el => {
                const file = el.getAttribute('data-include');
                if (file) {
                    fetch(file).then(res => res.ok ? res.text() : '').then(data => {
                        el.innerHTML = data; 
                        el.removeAttribute('data-include'); 
                        pCount++;
                        
                        if (pCount === elements.length) {
                            const checkReady = setInterval(() => {
                                if (typeof window.initCommonScript === 'function') { 
                                    clearInterval(checkReady); 
                                    window.initCommonScript(); 
                                    window.scrollTo(0, 0);
                                }
                            }, 50);
                        }
                    }).catch(err => console.error(err));
                }
            });
        }
        window.addEventListener('DOMContentLoaded', initIncludes);
    </script>
</head>
<body>
<div data-include="/pub/inc/header.html"></div>
<main class="container terms_wrap" id="mainContent">
<section class="inner" aria-labelledby="total-search-title">
	<h1 id="total-search-title" class="subtitle">약관 및 정책</h1>

	<div class="aside_wrap no_image">
		<nav class="aside">
			<ul class="snb">
				<li><a href="/terms/policy.html">이용약관</a></li>
				<li class="no_before"><a href="/terms/privacy.html"><strong>개인정보처리방침</strong></a></li>
				<li class="on"><a href="/terms/no_email.html">이메일 무단수집거부</a></li>
				<li><a href="/terms/cctv.html">영상정보처리기기 운영방침</a></li>
			</ul>
		</nav>
	</div>

	<div class="gbox terms_box email_box">
		<h2>이메일 무단수집거부</h2>
		<p>본 웹사이트에 게시된 이메일 주소가 전자우편 수집 프로그램이나 그 밖의 기술적 장치를 이용하여 무단으로 수집되는 것을 거부하며 <br class="pc_vw">이를 위반시 정보통신망법에 의해 형사처벌됨을 유념하시길 바랍니다.</p>
	</div>
	
</section>

</main>
<div data-include="/pub/inc/footer.html"></div>

</body>
</html>
